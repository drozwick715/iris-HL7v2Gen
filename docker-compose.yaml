services:
  iris:
    build: 
      context: .
      dockerfile: Dockerfile
    image:  containers.intersystems.com/intersystems/irishealth:2025.1
    container_name: iris-server

    restart: always
    ports:
      - "1972:1972"   # Superserver port (ObjectScript / JDBC / ODBC)
      - "52773:52773" # Internal Management Portal Web Port


  webgateway:
    image:  containers.intersystems.com/intersystems/webgateway:2025.1
    container_name: iris-webgateway
    restart: always
    ports:
      - "80:80"       # External HTTP port
      - "443:443"     # External HTTPS port
    environment:
      - ISC_CSP_CONF_FILE=/webgateway/csp.conf
      - .env
    volumes:
      - .\webgateway\csp.conf:/webgateway/csp.conf
    depends_on:
      - iris

